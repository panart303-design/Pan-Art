<!DOCTYPE html>

<html lang="en">

<head> <meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Shopping Cart - Pan Art</title>

<link
    rel="stylesheet"
    href="css/cart.css"
>

</head>

<body>

<!-- ========================================
     HEADER
========================================= -->
<header class="cart-header">

    <div class="logo">
        <a href="artwork.html">
            PAN ART
        </a>
    </div>

    <nav>

        <a href="artwork.html">
            Artwork
        </a>

        <a
            href="cart.html"
            class="active"
        >
            Cart
        </a>

        <button
            type="button"
            id="logoutBtn"
            class="logout-btn"
        >
            Logout
        </button>

    </nav>

</header>


<!-- ========================================
     CART PAGE
========================================= -->
<main class="cart-page">

    <div class="page-heading">

        <h1>
            Your Cart
        </h1>

        <p>
            Review the artwork you want to purchase.
        </p>

    </div>


    <!-- ========================================
         EMPTY CART MESSAGE
    ========================================= -->
    <section
        id="emptyCart"
        class="empty-cart"
    >

        <h2>
            Your cart is empty
        </h2>

        <p>
            You haven't added any artwork to your cart yet.
        </p>

        <a
            href="artwork.html"
            class="browse-btn"
        >
            Browse Artwork
        </a>

    </section>


    <!-- ========================================
         CART CONTENT
    ========================================= -->
    <section
        id="cartContent"
        class="cart-content hidden"
    >

        <!-- ====================================
             CART ITEMS
        ===================================== -->
        <div
            id="cartItems"
            class="cart-items"
        >
        </div>


        <!-- ====================================
             CART SUMMARY
        ===================================== -->
        <aside class="cart-summary">

            <h2>
                Order Summary
            </h2>

            <div class="summary-row">

                <span>
                    Items
                </span>

                <span id="itemCount">
                    0
                </span>

            </div>

            <div class="summary-row total-row">

                <span>
                    Total
                </span>

                <span id="cartTotal">
                    ₦0
                </span>

            </div>


            <!-- =================================
                 CHECKOUT BUTTON
            ================================== -->
            <button
                type="button"
                id="checkoutBtn"
                class="checkout-btn"
            >
                Proceed to Checkout
            </button>

        </aside>

    </section>

</main>


<!-- ========================================
     JAVASCRIPT
========================================= -->
<script src="js/cart.js"></script>

</body> </html>
