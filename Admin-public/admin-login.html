<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Pan Art - Admin Login</title>

<link
    rel="stylesheet"
    href="/admin-css/admin-login.css"
>

</head>

<body>

<main class="login-page">

<section class="login-card">

    <div class="logo">
        PAN ART
    </div>

    <div class="login-heading">

        <h1>
            Admin Login
        </h1>

        <p>
            Sign in to manage the Pan Art marketplace.
        </p>

    </div>


    <form id="adminLoginForm">

        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter admin email"
                autocomplete="email"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter admin password"
                autocomplete="current-password"
                required
            >

        </div>


        <div
            id="message"
            class="message"
        ></div>


        <button
            type="submit"
            id="loginButton"
        >
            Login
        </button>

    </form>

</section>

</main>

<script src="/admin-js/admin-login.js"></script>

</body>

</html>
